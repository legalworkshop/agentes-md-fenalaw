<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>{TITULO}</title>
<!--
  MODELO DE CONTRATO VISUAL EM INFOGRÁFICO (A4 retrato, HTML que vira PDF pelo Chrome headless).
  Para reutilizar: copie este bloco <style> e a biblioteca de símbolos <svg><defs> inteiros.
  Cada folha é uma <section class="pg">; cada figura, um <div class="f"> com posição absoluta
  (left/top/width/height em px, origem no canto da folha; área útil de 34 a 760 em x).
  Todo elemento que representa dispositivo carrega data-cl="<cláusulas>" (lido pelo check.py).
-->
<style>
/* ===== 1. Página e tokens ===== */
@page { size: 210mm 297mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #14233D;     /* tinta navy: texto, objeto principal e numeral de PRAZO */
  --ink2: #33425B;    /* texto corrido */
  --mute: #5A667A;    /* rótulo secundário */
  --acc: #2F5D8A;     /* acento azul: fluxo, objeto, marcador */
  --acc2: #7C9CBE; --acc3: #C7D7E8; --acc4: #EBF1F8;   /* rampa do acento */
  --warm: #9C4A17;    /* laranja: só CONSEQUÊNCIA (crédito, justa causa, exceção ao teto, descumprimento) */
  --warm2: #D08A57; --warm3: #F3E2D4;
  --line: #C3CDDA; --land: #E2E9F1; --paper: #FFFFFF;
}
html, body { background: var(--paper); }
body { font-family: 'Segoe UI', sans-serif; color: var(--ink); font-size: 10.5px; line-height: 1.36;
       -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pg { width: 210mm; height: 297mm; position: relative; overflow: hidden; break-after: page;
      background: radial-gradient(ellipse 62% 34% at var(--lx, 50%) var(--ly, 32%), #E6EEF7 0%, #FFFFFF 72%); }   /* cores opacas: halo com alfa vira sombreamento tipo 1, que o pdf.js não desenha (14/10/2026) */
.pg:last-child { break-after: auto; }

/* ===== 2. Moldura: cabeçalho, título, rodapé ===== */
.hdr { position: absolute; left: 34px; right: 34px; top: 16px; display: flex; justify-content: space-between;
       font-family: 'Bahnschrift', sans-serif; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute);
       padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.hdr b { color: var(--ink); font-weight: 600; }
.ttl { position: absolute; left: 34px; right: 34px; top: 44px; display: flex; align-items: flex-end; gap: 14px; }
.ttl .num { font-family: 'Bahnschrift', sans-serif; font-weight: 600; font-size: 50px; line-height: .8; color: var(--acc); }
.ttl h1 { font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif; font-weight: 600; font-size: 22px; line-height: 1.12; color: var(--ink); letter-spacing: -.01em; }
.ttl .sub { font-size: 10px; color: var(--mute); margin-top: 3px; font-weight: 400; font-family: 'Segoe UI', sans-serif; }
.ftr { position: absolute; left: 34px; right: 34px; bottom: 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
       border-top: 1px solid var(--line); padding-top: 5px; font-size: 8.3px; color: var(--mute); line-height: 1.3; }
.ftr .pn { font-family: 'Bahnschrift', sans-serif; font-size: 11px; color: var(--ink); font-weight: 600; white-space: nowrap; }
.ftr .cor b { color: var(--warm); font-weight: 600; } .ftr .cor i { color: var(--ink); font-style: normal; font-weight: 600; }

/* ===== 3. Figura: posicionamento ===== */
.f { position: absolute; }
.f > * { position: absolute; }
.f > svg { left: 0; top: 0; overflow: visible; }

/* ===== 4. Tipografia: três níveis (display, título de item, corpo) ===== */
.big { font-family: 'Bahnschrift', sans-serif; font-weight: 600; line-height: .95; color: var(--ink); letter-spacing: -.01em; }
.h { font-family: 'Segoe UI Semibold', 'Segoe UI', sans-serif; font-weight: 600; font-size: 12.5px; line-height: 1.2; color: var(--ink); }
.t { font-size: 10.5px; line-height: 1.36; color: var(--ink2); }
.t.s { font-size: 9.6px; line-height: 1.34; }
.t.xs { font-size: 8.8px; line-height: 1.28; }
.lbl { font-family: 'Bahnschrift', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--acc); }
.cl { font-family: 'Bahnschrift', sans-serif; font-size: 8.5px; color: var(--acc); letter-spacing: .02em; white-space: nowrap; font-weight: 400; text-transform: none; }
.cl.inv { color: #B9CCE2; }

/* ===== 5. Código de cor ===== */
.a  { color: var(--acc); }
.dl { color: var(--ink); }      /* numeral de prazo */
.cq { color: var(--warm); }     /* consequência */
.wt { color: #fff; }

/* ===== 6. Peças repetidas ===== */
.mk { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%;
      background: var(--acc); color: #fff; font-family: 'Bahnschrift', sans-serif; font-weight: 600; font-size: 10px; line-height: 1;
      vertical-align: -3px; margin-right: 6px; flex-shrink: 0; }
.mk.cq { background: var(--warm); color: #fff; }
.pill { display: inline-block; font-family: 'Bahnschrift', sans-serif; font-weight: 600; font-size: 8.8px; letter-spacing: .1em; text-transform: uppercase;
        padding: 2px 7px; border-radius: 3px; background: var(--acc); color: #fff; }
.pill.l { background: var(--acc4); color: var(--acc); border: 1px solid var(--acc3); }
.pill.k { background: var(--ink); }
.tag { background: #fff; border: 1px solid var(--acc3); border-radius: 4px; padding: 5px 7px; }
.chip { background: #fff; border: 1.4px solid var(--ink); border-radius: 6px; padding: 6px 8px; }
.ico { width: 22px; height: 22px; color: var(--acc); display: inline-block; vertical-align: middle; }
.ico.i { width: 15px; height: 15px; vertical-align: -3px; }
ul.k { list-style: none; }
ul.k li { position: relative; padding-left: 13px; margin-bottom: 3px; }
ul.k li::before { content: ""; position: absolute; left: 1px; top: 6px; width: 6px; height: 6px; background: var(--acc); border-radius: 1px; }
ul.k.ck li::before { background: none; width: 7px; height: 4px; border-left: 1.6px solid var(--acc); border-bottom: 1.6px solid var(--acc); transform: rotate(-45deg); top: 4px; border-radius: 0; }
ul.k.no li::before { background: none; border: 1.4px solid var(--mute); width: 5px; height: 5px; transform: rotate(45deg); }
.ix { display: flex; gap: 6px; }
.ix > div { flex: 1; text-align: center; font-size: 8.2px; line-height: 1.18; color: var(--ink2); }
.ix svg { width: 17px; height: 17px; color: var(--acc); display: block; margin: 0 auto 2px; }
</style></head><body>
